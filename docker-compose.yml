services:
  tg_bot:
    build:
      context: .
      dockerfile: tg_bot/Dockerfile
    container_name: pravburo_bot
    restart: always
    env_file:
      - tg_bot/.env
    environment:
      # DB_HOST — WireGuard-адрес сервера БД (РФ), см. deploy/SPLIT_DEPLOYMENT.md.
      # Значения POSTGRES_*/DB_HOST берутся из корневого .env (не в git).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST}:${DB_PORT:-5432}/${POSTGRES_DB:-bot_pravburo}
    volumes:
      - ./data:/app/data

  vk_bot:
    build:
      context: .
      dockerfile: vk_bot/Dockerfile
    container_name: pravburo_vk_bot
    restart: always
    env_file:
      - vk_bot/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST}:${DB_PORT:-5432}/${POSTGRES_DB:-bot_pravburo}
    volumes:
      - ./data:/app/data

  admin:
    build:
      context: .
      dockerfile: admin_bot/backend/Dockerfile
    container_name: pravburo_admin
    restart: always
    env_file:
      - admin_bot/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${DB_HOST}:${DB_PORT:-5432}/${POSTGRES_DB:-bot_pravburo}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8123:8000"
