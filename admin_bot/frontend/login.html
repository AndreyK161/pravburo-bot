<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Админка Правбюро</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f6] text-[#1f2530] min-h-screen flex items-center justify-center px-4">

<form id="loginForm" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8 w-full max-w-sm space-y-4">
  <div class="flex flex-col items-center mb-2">
    <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-lg bg-[#F5A524]">
      <svg viewBox="0 0 24 24" fill="none" stroke="#15171c" stroke-width="1.8" class="h-6 w-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
      </svg>
    </div>
    <h1 class="text-xl font-semibold">Админка ботов Правбюро</h1>
  </div>

  <div>
    <label class="text-sm font-medium text-gray-500 block mb-1">Логин</label>
    <input id="username" type="text" autocomplete="username" class="border border-gray-300 rounded-lg px-3 py-2.5 text-sm w-full shadow-sm focus:border-gray-500 focus:outline-none focus:ring-1 focus:ring-gray-500">
  </div>

  <div>
    <label class="text-sm font-medium text-gray-500 block mb-1">Пароль</label>
    <input id="password" type="password" autocomplete="current-password" class="border border-gray-300 rounded-lg px-3 py-2.5 text-sm w-full shadow-sm focus:border-gray-500 focus:outline-none focus:ring-1 focus:ring-gray-500">
  </div>

  <button type="submit" class="bg-[#15171c] text-white text-sm font-medium px-4 py-2.5 rounded-lg w-full transition hover:bg-[#282b33]">Войти</button>

  <div id="loginError" class="text-sm text-red-600 text-center"></div>
</form>

<script type="module">
  const form = document.getElementById("loginForm");
  const errorEl = document.getElementById("loginError");

  const params = new URLSearchParams(window.location.search);
  if (params.has("expired")) {
    errorEl.textContent = "Сессия истекла, войдите заново";
  } else if (params.has("sso_failed")) {
    errorEl.textContent = "Не удалось войти через LK — попробуйте обычный вход";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.detail ?? "Не удалось войти";
        return;
      }
      window.location.href = "/";
    } catch {
      errorEl.textContent = "Ошибка сети";
    }
  });
</script>
</body>
</html>
